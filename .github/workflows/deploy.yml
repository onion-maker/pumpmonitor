name: Deploy PumpMonitor Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: project-d1165e3e-a48c-4491-a1b
          workload_identity_provider: projects/324388734718/locations/global/workloadIdentityPools/pumpmonitor-pool/providers/github

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pumpmonitor-server
          source: ./server
          region: asia-east1
          project_id: project-d1165e3e-a48c-4491-a1b